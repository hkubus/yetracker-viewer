packages:
  - "apps/*"
  - "packages/*"

# esbuild's install script links its platform binary; nothing else needs one.
allowBuilds:
  esbuild: true

# Astro only uses sharp for its default image service. The web app is configured
# with the passthrough service, so the optional native dependency is not installed.
ignoredOptionalDependencies:
  - sharp

overrides:
  # Keep every PostCSS consumer on a release that pulls a patched nanoid.
  postcss: ^8.5.28
