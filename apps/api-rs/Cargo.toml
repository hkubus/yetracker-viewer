[package]
name = "yetracker-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
lru = "0.18.4"
once_cell = "1.21.4"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-deflate", "limit", "set-header", "timeout"] }
url = "2.5.7"
