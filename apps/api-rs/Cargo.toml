[package]
name = "yetracker-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
dotenvy = "0.15.7"
# Prefer the zlib-rs backend for every flate2 user (tower-http gzip, reqwest):
# about twice as fast as the default miniz_oxide, same output size.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3.34"
hex = "0.4.3"
http-body = "1"
httpdate = "1.0.3"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "service", "http1"] }
libc = "0.2"
lru = "0.18.4"
memchr = "2.8.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.24.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-deflate", "limit", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
url = "2.5.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
